name: Apply dictionary registry source fix

on:
  push:
    branches: [fix/dictionary-registry-integrity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dictionary-registry-integrity
      - name: Apply exact source fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/resources/dictionary.ts')
          text = path.read_text()

          level2_old = """  {
            id: 'frequently_used_words03',
            name: '超频单词level 2',
            description: '超频单词level 2',
            category: '中国考试',
            tags: ['其他'],
            url: '/dicts/frequently_used_word02.json',
            length: 1040,
            language: 'en',
            languageCategory: 'en',
          },"""
          level2_new = level2_old.replace("id: 'frequently_used_words03'", "id: 'frequently_used_words02'")
          assert text.count(level2_old) == 1, 'level2 source block changed unexpectedly'
          text = text.replace(level2_old, level2_new)

          redundant_oxford = """  {
            id: 'Oxford5000',
            name: '牛津5000词',
            description: '牛津5000词',
            category: '中国考试',
            tags: ['其他'],
            url: '/dicts/Oxford5000.json',
            length: 5836,
            language: 'en',
            languageCategory: 'en',
          },
"""
          assert text.count(redundant_oxford) == 1, 'redundant China-exam Oxford block changed unexpectedly'
          text = text.replace(redundant_oxford, '')

          old_map = "export const idDictionaryMap: Record<string, Dictionary> = Object.fromEntries(dictionaries.map((dict) => [dict.id, dict]))"
          new_map = """export const idDictionaryMap: Record<string, Dictionary> = dictionaries.reduce<Record<string, Dictionary>>(
            (registry, dict) => {
              if (Object.prototype.hasOwnProperty.call(registry, dict.id)) {
                throw new Error(`duplicate_dictionary_id:${dict.id}`)
              }
              registry[dict.id] = dict
              return registry
            },
            Object.create(null) as Record<string, Dictionary>
          )"""
          assert text.count(old_map) == 1, 'dictionary map construction changed unexpectedly'
          text = text.replace(old_map, new_map)

          path.write_text(text)
          PY
          git diff --check
      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/resources/dictionary.ts
          git commit -m 'fix: enforce dictionary registry integrity'
          git push origin HEAD:fix/dictionary-registry-integrity
