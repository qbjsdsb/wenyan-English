name: Status patch once

on:
  push:
    branches: [fix/registry-closure]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/registry-closure
      - name: Patch status handoff
        run: python scripts/patch-status-registry-once.py
      - name: Commit status handoff
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/STATUS.md
          git commit -m 'docs: refresh registry closure handoff'
          git push origin HEAD:fix/registry-closure
