name: Bootstrap Qwerty Learner baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'qbjsdsb/wenyan-English' && (github.event_name == 'workflow_dispatch' || github.head_ref == 'bootstrap/qwerty-baseline')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap/qwerty-baseline
          fetch-depth: 0

      - name: Fetch pinned Qwerty Learner baseline
        run: |
          git clone https://github.com/RealKai42/qwerty-learner.git /tmp/qwerty-learner
          git -C /tmp/qwerty-learner checkout 1182426f2bd0a28c95302c33f9e19136b1262a70

      - name: Import upstream snapshot and preserve bootstrap metadata
        run: |
          mkdir -p /tmp/wenyan-preserve/.github/workflows
          cp .github/workflows/bootstrap-upstream.yml /tmp/wenyan-preserve/.github/workflows/bootstrap-upstream.yml

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/qwerty-learner/ ./

          mkdir -p .github/workflows
          cp /tmp/wenyan-preserve/.github/workflows/bootstrap-upstream.yml .github/workflows/bootstrap-upstream.yml

          cat > UPSTREAM.md <<'EOF'
          # Upstream baseline

          Wenyan English is based on Qwerty Learner.

          - Upstream: `RealKai42/qwerty-learner`
          - Baseline commit: `1182426f2bd0a28c95302c33f9e19136b1262a70`
          - Baseline date: 2026-09-08
          - License inherited from upstream: GPL-3.0

          The initial import is intentionally pinned to an exact upstream commit so later Wenyan-specific changes remain reviewable and upstream updates can be evaluated deliberately rather than pulled blindly.
          EOF

      - name: Commit imported baseline to bootstrap branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: import Qwerty Learner baseline at 1182426'
          git push origin HEAD:bootstrap/qwerty-baseline
