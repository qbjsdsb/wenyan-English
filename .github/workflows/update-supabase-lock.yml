name: Update Supabase lockfile

on:
  push:
    branches: [feature/supabase-sync-v1]
    paths:
      - package.json
      - .github/workflows/update-supabase-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supabase-sync-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Refresh lockfile
        run: yarn install
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json yarn.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: refresh lockfile for Supabase client'
          git push origin HEAD:feature/supabase-sync-v1
