name: Semantic reordered duplicate patch once

on:
  push:
    branches: [feat/semantic-distractor-quality]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-distractor-quality
      - name: Patch reordered semantic duplicates
        run: python scripts/patch-semantic-reordered-duplicates-once.py
      - name: Commit semantic duplicate guard
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/semantic/discrimination.ts scripts/check-semantic.mjs
          git commit -m 'fix: exclude reordered duplicate meanings'
          git push origin HEAD:feat/semantic-distractor-quality
