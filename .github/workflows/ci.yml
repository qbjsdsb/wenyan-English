name: Wenyan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-22.04
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dictionary-registry-integrity
      - name: Apply exact dictionary registry source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/resources/dictionary.ts')
          text = path.read_text()

          level2 = """  {
            id: 'frequently_used_words03',
            name: '超频单词level 2',
            description: '超频单词level 2',
            category: '中国考试',
            tags: ['其他'],
            url: '/dicts/frequently_used_word02.json',
            length: 1040,
            language: 'en',
            languageCategory: 'en',
          },"""
          assert text.count(level2) == 1
          text = text.replace(level2, level2.replace("id: 'frequently_used_words03'", "id: 'frequently_used_words02'"))

          oxford = """  {
            id: 'Oxford5000',
            name: '牛津5000词',
            description: '牛津5000词',
            category: '中国考试',
            tags: ['其他'],
            url: '/dicts/Oxford5000.json',
            length: 5836,
            language: 'en',
            languageCategory: 'en',
          },
"""
          assert text.count(oxford) == 1
          text = text.replace(oxford, '')

          old_map = "export const idDictionaryMap: Record<string, Dictionary> = Object.fromEntries(dictionaries.map((dict) => [dict.id, dict]))"
          new_map = """export const idDictionaryMap: Record<string, Dictionary> = dictionaries.reduce<Record<string, Dictionary>>(
            (registry, dict) => {
              if (Object.prototype.hasOwnProperty.call(registry, dict.id)) {
                throw new Error(`duplicate_dictionary_id:${dict.id}`)
              }
              registry[dict.id] = dict
              return registry
            },
            Object.create(null) as Record<string, Dictionary>
          )"""
          assert text.count(old_map) == 1
          text = text.replace(old_map, new_map)
          path.write_text(text)
          PY
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/resources/dictionary.ts
            git commit -m 'fix: enforce dictionary registry integrity'
            git push origin HEAD:fix/dictionary-registry-integrity
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Type check
        run: yarn tsc --noEmit
      - name: Smart Session deterministic scenarios
        run: node --experimental-strip-types scripts/check-smart-session.mjs
      - name: Execution availability deterministic scenarios
        run: node --experimental-strip-types scripts/check-execution-availability.mjs
      - name: Semantic measurement and agent guardrails
        run: node --experimental-strip-types scripts/check-semantic.mjs
      - name: AI Coaching deterministic scenarios
        run: node --experimental-strip-types scripts/check-coaching.mjs
      - name: AI Coach decision guardrail scenarios
        run: node --experimental-strip-types scripts/check-coach-decision.mjs
      - name: Cloud coaching adapter scenario
        run: node --experimental-strip-types scripts/check-coaching-adapter.mjs
      - name: Wenyan OAuth capability scenarios
        run: node --experimental-strip-types scripts/check-mcp-authorization.mjs
      - name: Package MCP source
        run: |
          mkdir -p ci-artifacts
          node scripts/package-mcp-source.mjs > ci-artifacts/wenyan-mcp-deploy.json
      - name: Build
        run: yarn build
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Verify Wenyan browser flows
        run: yarn playwright test tests/e2e/study-plan.spec.ts tests/e2e/sync-queue.spec.ts tests/e2e/workspace-state.spec.ts tests/e2e/event-restore.spec.ts tests/e2e/oauth-consent.spec.ts tests/e2e/smart-session.spec.ts tests/e2e/semantic.spec.ts tests/e2e/typing-reliability.spec.ts tests/e2e/vocabulary-surfaces.spec.ts tests/e2e/dictionary-integrity.spec.ts
      - name: Build production Pages artifact
        run: REACT_APP_DEPLOY_ENV=pages yarn vite build --base=/wenyan-English/
      - name: Verify Pages vocabulary and failure recovery
        run: yarn playwright test --config=playwright.pages.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wenyan-test-results
          path: |
            test-results/
            ci-artifacts/
