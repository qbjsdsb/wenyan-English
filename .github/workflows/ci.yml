name: Wenyan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-22.04
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Type check
        run: yarn tsc --noEmit
      - name: Build
        run: yarn build
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Verify Wenyan browser flows
        run: yarn playwright test tests/e2e/study-plan.spec.ts tests/e2e/sync-queue.spec.ts tests/e2e/event-restore.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wenyan-test-results
          path: test-results/
