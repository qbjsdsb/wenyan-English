name: Registry patch once

on:
  push:
    branches: [fix/registry-closure]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/registry-closure
      - name: Apply registry patch
        run: python scripts/patch-registry-once.py
      - name: Commit patch
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/resources/dictionary.ts
          git commit -m 'fix: enforce dictionary registry integrity'
          git push origin HEAD:fix/registry-closure
