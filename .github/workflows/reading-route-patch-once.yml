name: Reading route patch once

on:
  push:
    branches: [fix/reading-route-state]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reading-route-state
      - name: Patch reading route state
        run: python scripts/patch-reading-route-once.py
      - name: Commit reading fix
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Reading/index.tsx
          git commit -m 'fix: reset reading state when passage changes'
          git push origin HEAD:fix/reading-route-state
