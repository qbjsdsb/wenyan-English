<div class="study-main"><section class="study-core"><h1 class="word">consequence</h1><div class="phonetic">/ˈkɒnsɪkwəns/　<span style="font-family:var(--sans);font-size:14px">◖))</span></div><div class="question">这个词是什么意思？</div><div class="answer-wrap" id="answerWrap"><input id="answer" class="answer" autocomplete="off" placeholder="输入中文意思…"></div><div class="study-actions"><button class="submit" id="submit">Enter　提交 →</button><button>跳过</button><button>不确定</button></div></section>
<aside class="study-aside"><h3>提示</h3><div class="hint-def serif">n. 结果；后果；由某件事导致的影响</div><div class="aside-group"><b>相关词</b><div class="aside-list"><span>consequential　重要的；有后果的</span><span>consequently　因此；于是</span><span>in consequence　因此；结果</span></div></div><div class="aside-group"><b>例句</b><div class="aside-list"><span>Every action has consequences.</span><span>每个行为都会产生后果。</span></div></div></aside></div>

<script>const study=document.getElementById('study'),answer=document.getElementById('answer'),wrap=document.getElementById('answerWrap'),submit=document.getElementById('submit');answer.addEventListener('focus',()=>study.classList.add('is-focusing'));answer.addEventListener('blur',()=>study.classList.remove('is-focusing'));function check(){if(answer.value.trim()){wrap.classList.add('correct');study.classList.add('correct-state');setTimeout(()=>{wrap.classList.remove('correct');study.classList.remove('correct-state')},520)}}submit.onclick=check;answer.addEventListener('keydown',e=>{if(e.key==='Enter')check()});</script></body></html>
